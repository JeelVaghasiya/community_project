name: Pytest Suite

on:
  push:
    branches:
      - main
      - 'p[1-4]/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic sqlalchemy python-multipart requests httpx shapely pytest pytest-asyncio

      - name: Run Pytest
        run: pytest -v
